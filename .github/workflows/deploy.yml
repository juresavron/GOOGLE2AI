# Deploy to Fly on every push to main, the way imap2ai and whatsapp2ai do it: test, deploy, then
# prove the running server is the commit we just pushed. Same reason as theirs — the slow part of
# building one of these was never the bugs, it was not knowing whether the live server had the fix.
#
# ONE-TIME SETUP, and the first step is not optional:
#   1. Fly dashboard -> google2ai -> Settings -> detach the GitHub repo.
#      NOT OPTIONAL, and not theoretical: this app was launched from Fly's web UI, so the repo IS
#      currently attached. While it is, FLY DEPLOYS TOO, and two pipelines releasing the same app
#      concurrently fails with "failed to acquire lease ... held by ...@tokens.fly.io".
#      Fly's launcher also rewrote fly.toml on its way through, changing internal_port to 8080
#      while leaving PORT at 8000 -- an app that listened on one port while the proxy knocked on
#      the other, with no diagnosable symptom. This workflow deploys the repo's own config.
#   2. fly tokens create deploy -a google2ai
#   3. GitHub -> Settings -> Secrets and variables -> Actions -> new secret
#      Name: FLY_API_TOKEN   Value: the token
#   4. Settings -> General -> default branch -> main
name: deploy

on:
  push:
    # main, AND the working branch -- because this repository has no main yet. Its first commit went
    # to claude/blissful-thompson-dhddf5, so a main-only trigger meant this workflow had never run
    # once, which is why the first deploy had to go through Fly's web launcher and arrived with a
    # rewritten fly.toml and a port mismatch.
    #
    # DROP THE SECOND ENTRY the moment main exists. Listing both would double every deploy, and the
    # concurrency group below would cancel one of them -- possibly after machines had started
    # rolling.
    branches: [main, claude/blissful-thompson-dhddf5]
  # Lets a deploy be started by hand from the Actions tab, without pushing anything.
  workflow_dispatch: {}

concurrency:
  group: deploy-google2ai
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A REAL Postgres, for the last step in this job.
    #
    # Not for the unit tests -- those stay offline against fakes, deliberately. This is for the
    # statements in src/db.ts, which until now nothing could check: tests/db.test.ts drives a fake
    # Queryable that accepts any string, and scripts/check-sql.py only parses db/*.sql. The safety
    # net was a line in a comment saying each statement "was PREPAREd against a real Postgres
    # once", by hand. That ritual failed, and what shipped was a statement Postgres refuses to
    # parse at all -- 42P08 on every call, surfacing as a button that blamed the user's spelling.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        # -U/-d are not decoration: bare `pg_isready` probes as the runner's own user, which this
        # image has no role for. It logs `FATAL: role "root" does not exist` on every probe and
        # still reports healthy, because pg_isready counts a REJECTED connection as "server is
        # up". So the check would pass on a container whose credentials were wrong, and the real
        # failure would surface later as an unexplained step error.
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm run typecheck
      # Every test runs offline against the seeded mock (GSC_MOCK=1), so CI needs no Google
      # credentials and cannot spend anybody's API quota.
      - run: npm test

      # The Node suite never executes the SQL, so this parses it with Postgres's own grammar --
      # the only thing that catches a typo in a schema file before the one code path using it
      # runs in production.
      - name: The SQL is valid Postgres
        run: pip install --quiet pglast && python3 scripts/check-sql.py

      # The other half: the statements that live in TypeScript rather than in db/*.sql. The schema
      # is applied for real first, so a column that does not exist fails here too -- pglast would
      # happily parse a select naming one that was never created.
      - name: Every statement in src/db.ts parses against a real Postgres
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f scripts/ci-supabase-shim.sql

          # GLOBBED, not listed. A hardcoded list is a second place to remember a new migration,
          # and it was forgotten the first time it mattered: 006 went into DEPLOY.md and not into
          # this file, so CI built a schema with no gsc_settings and the run failed on a statement
          # that was perfectly correct. schema.sql is named separately because it must be first and
          # sorts last.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f db/schema.sql
          for f in $(ls db/[0-9]*.sql | sort); do
            echo "applying $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -q -f "$f"
          done
          node --disable-warning=ExperimentalWarning scripts/check-db-sql.mjs

  deploy:
    needs: test # never deploy a red build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only -a google2ai --build-arg GIT_SHA=${{ github.sha }}

      - name: Confirm the deployed build is the one we just pushed
        timeout-minutes: 4
        env:
          MACHINE: google2ai.fly.dev
        run: |
          sleep 20
          # --max-time and --connect-timeout are load-bearing, not tidiness. Without them a
          # SUSPENDED Fly app -- one whose proxy accepts the connection and then waits forever for a
          # machine that never starts -- hangs this step until the job's 20-minute timeout, with no
          # output and nothing to read. It happened. A verification step that cannot fail promptly
          # is not verifying anything; it is just waiting.
          curl -fsS --connect-timeout 10 --max-time 25 --retry 5 --retry-delay 4 --retry-all-errors https://$MACHINE/healthz | tee /tmp/healthz.txt
          echo
          test -s /tmp/healthz.txt || { echo "$MACHINE/healthz returned nothing"; exit 1; }
          grep -q "${GITHUB_SHA:0:7}" /tmp/healthz.txt \
            || { echo "MISMATCH: the live server is not running this commit"; exit 1; }
          echo "OK: live build matches ${GITHUB_SHA:0:7}"

          # /status is public and must stay that way -- it is the one endpoint a stranger can read.
          curl -fsSL --connect-timeout 10 --max-time 25 --retry 5 --retry-delay 4 --retry-all-errors https://$MACHINE/status | tee /tmp/status.json
          echo
          python3 - <<'PY'
          import json, sys
          s = json.load(open('/tmp/status.json'))
          # A regression that published the customer's domain or the error text (which quotes it)
          # would be invisible from a green deploy, so assert the absence here rather than trusting
          # review to catch it. tests/e2e.test.ts asserts the same list against a local server.
          SECRETS = ('siteUrl', 'site_url', 'default_site', 'defaultSite', 'error',
                     'secret', 'token', 'refresh_token', 'client_secret', 'quota_project')
          leaked = [k for k in SECRETS if k in s]
          if leaked:
              print(f"PUBLIC /status LEAKS: {leaked}"); sys.exit(1)
          # Read defensively: this step must report on the payload, never crash on its shape.
          print(f"OK: /status is clean; commit={s.get('commit')} auth={s.get('auth')} "
                f"ready={s.get('ready')} properties={s.get('properties')} multi_tenant={s.get('multi_tenant')}")
          if s.get('auth') == 'adc':
              print('::error::the live server has no credentials configured -- every tool will fail'); sys.exit(1)
          if s.get('auth') == 'mock':
              print('::error::the live server is serving MOCK data'); sys.exit(1)
          # Credentials that stopped working are the one failure this deploy cannot fix and the one
          # nobody notices: the server keeps answering while every tool returns an error.
          if not s.get('healthy'):
              print('::warning::Google is refusing these credentials -- open /<MCP_SECRET>/setup')
          PY
